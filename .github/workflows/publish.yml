name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - claude-skills
          - agent-memory
          - code-indexer
          - obsidian-sync
  push:
    tags:
      - "v*-plugin"
      - "v*-agent-memory"
      - "v*-code-indexer"
      - "v*-obsidian-sync"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - id: pkg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dir="${{ github.event.inputs.package }}"
          else
            suffix="${GITHUB_REF_NAME#v*-}"
            case "$suffix" in
              plugin) dir=claude-skills ;;
              *) dir="$suffix" ;;
            esac
          fi
          echo "dir=packages/$dir" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build --workspaces --if-present

      - run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
